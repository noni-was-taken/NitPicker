<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%picker.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NitPick</title>
    <script>
      // Prevent FOUC (Flash of Unstyled Content) by applying theme before React renders
      // Saved choice wins; otherwise follow the OS. Storage can throw when it is blocked.
      let theme = null
      try { theme = localStorage.getItem('theme') } catch {}
      if (theme === 'dark' || (theme === null && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
